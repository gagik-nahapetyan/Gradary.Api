name: Build and Deploy

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '8.0.x'
            - name: Run unit tests
              run: dotnet test OnlineLibrary.Test/OnlineLibrary.Test.csproj
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: ghcr.io/gagik-nahapetyan/gradary.api:latest
            - name: Deploy to Azure Container App
              uses: azure/container-apps-deploy-action@v1
              with:
                appSourcePath: ${{ github.workspace }}
                acrName: ghcr.io
                containerAppName: gradary-dev-api
                resourceGroup: gradary-dev-rg
                imageToDeploy: ghcr.io/gagik-nahapetyan/gradary.api:latest
                azureCredentials: ${{ secrets.AZURE_CREDENTIALS }}
                
